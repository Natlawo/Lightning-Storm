<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Lightning Sphere: Apocalypse</title>
    <style>
        body { 
            background-color: #050508; 
            color: white; 
            text-align: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 { 
            margin-top: 15px; 
            font-size: 1.8rem; 
            letter-spacing: 3px;
            font-weight: 900;
            text-shadow: 0 0 10px #b666ff, 0 0 20px #8a2be2; 
        }
        p { margin: 5px; font-size: 1rem; color: #aaa; }
        #scoreId { font-weight: bold; color: #00ffff; font-size: 1.3rem; text-shadow: 0 0 10px #00ffff; }
        #levelId { font-weight: bold; color: #b666ff; font-size: 1.1rem; text-shadow: 0 0 8px #b666ff; }
        #livesId { font-size: 1.2rem; }
        
        #gameCanvas { 
            background-color: #020205; 
            display: block; 
            margin: 10px auto; 
            border: 3px solid #b666ff; 
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.5);
            max-width: 95vw;
            max-height: 70vh;
        }
    </style>
</head>
<body>

    <h1>LIGHTNING SPHERE: APOCALYPSE</h1>
    <p>Score: <span id="scoreId">0</span> | <span id="levelId">LEVEL 1</span></p>
    <p>Nyawa: <span id="livesId">💖 💖 💖</span></p>
    <p style="font-size: 0.8rem; color: #777;">Laptop: Arrow Keys & Spacebar | Phone: Sentuh Kiri/Kanan Skrin</p>
    
    <canvas id="gameCanvas" width="360" height="520"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("scoreId");
        const levelElement = document.getElementById("levelId");
        const livesElement = document.getElementById("livesId");

        let score = 0;
        let currentLevel = 1;
        let lives = 3; // Mula dengan 3 nyawa macam kau minta!
        let lastMilestone = 0;
        let gameOver = false;
        
        let bullets = [];      // Peluru player
        let enemyBullets = []; // Peluru musuh (Level 3)
        let enemies = [];
        let particles = []; 
        let stars = [];     
        let enemyTimer = 0;

        let isInvulnerable = false;
        let invulnerableTimer = 0;

        let currentEnemySpeed = 1.8;
        let spawnRate = 55; 

        // Cipta bintang latar belakang
        for (let i = 0; i < 40; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 1 + 0.5
            });
        }

        let player = {
            x: 160,
            y: 450,
            radius: 20, 
            speed: 7
        };

        // 🔊 ENJIN BUNYI DIGITAL
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } 
            else if (type === 'enemyshoot') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(200, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
            else if (type === 'kill') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } 
            else if (type === 'hurt') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
            else if (type === 'defeat') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.7);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
                osc.start(now); osc.stop(now + 0.7);
            }
            else if (type === 'achievement') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); 
                osc.frequency.setValueAtTime(783.99, now + 0.08); 
                osc.frequency.setValueAtTime(1046.50, now + 0.16); 
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now); osc.stop(now + 0.35);
            }
        }

        function updateLivesUI() {
            let heartString = "";
            for (let i = 0; i < lives; i++) {
                heartString += "💖 ";
            }
            livesElement.innerText = heartString || "💔";
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    alpha: 1, decay: Math.random() * 0.03 + 0.02,
                    color: color
                });
            }
        }

        // KONTROL
        let keys = {};
        document.addEventListener("keydown", (e) => { keys[e.key] = true; });
        document.addEventListener("keyup", (e) => { keys[e.key] = false; });
        document.addEventListener("keydown", (e) => {
            if ((e.key === " " || e.key === "Spacebar") && !gameOver) fireBullet();
        });

        let isTouchingLeft = false, isTouchingRight = false;
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            let touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
            if (touchX < canvas.width / 2) isTouchingLeft = true; else isTouchingRight = true;
        }, {passive: false});
        canvas.addEventListener("touchend", () => { isTouchingLeft = false; isTouchingRight = false; });

        // LOGIK TEMBAKAN MENGIKUT LEVEL
        function fireBullet() {
            if (currentLevel === 1) {
                // Level 1: Peluru Tunggal
                bullets.push({ x: player.x, y: player.y - player.radius, vx: 0, vy: -11 });
            } 
            else if (currentLevel === 2) {
                // Level 2: Peluru Ganda (Ganda 2)
                bullets.push({ x: player.x - 10, y: player.y - player.radius, vx: 0, vy: -11 });
                bullets.push({ x: player.x + 10, y: player.y - player.radius, vx: 0, vy: -11 });
            } 
            else if (currentLevel === 3) {
                // Level 3: Peluru Triple (Ganda 3 - Kipas)
                bullets.push({ x: player.x, y: player.y - player.radius, vx: 0, vy: -11 });
                bullets.push({ x: player.x - 12, y: player.y - player.radius, vx: -2, vy: -10.5 }); // Serong kiri
                bullets.push({ x: player.x + 12, y: player.y - player.radius, vx: 2, vy: -10.5 });  // Serong kanan
            }
            playSound('shoot');
        }

        // Auto Shoot Phone
        setInterval(() => {
            if (!gameOver && (isTouchingLeft || isTouchingRight)) fireBullet();
        }, 180);

        // ENGINE UTAMA
        function updateGame() {
            if (gameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 32px sans-serif";
                ctx.shadowBlur = 15; ctx.shadowColor = "#ff0000";
                ctx.fillText("SYSTEM FAILURE", 50, 240);
                ctx.fillStyle = "#fff";
                ctx.font = "16px sans-serif";
                ctx.shadowBlur = 0;
                ctx.fillText("Refresh (F5) untuk reboot semula", 60, 285);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // LOGIK DINAMIK PENINGKATAN TAHAP KESUKARAN & FASA
            if (score >= 300 && currentLevel === 2) {
                currentLevel = 3;
                lives -= 1; // POTONG 1 NYAWA DARI BAKI SEBELUMNYA!
                if (lives <= 0) lives = 1; // Bagi peluang minimum 1 nyawa biar tak terus mati konyol
                updateLivesUI();
                playSound('hurt'); 
                spawnRate = 45; // Musuh keluar laju bertubi-tubi
                levelElement.innerText = "LEVEL 3: DOOMDAY 💀 (TRIPLE LASER)";
                levelElement.style.color = "#ff0055";
            } 
            else if (score >= 100 && score < 300 && currentLevel === 1) {
                currentLevel = 2;
                playSound('achievement');
                spawnRate = 50;          
                levelElement.innerText = "LEVEL 2: CYBER SHIFT 🔥 (TWIN LASER)";
                levelElement.style.color = "#00ffff";
            }

            if (isInvulnerable) {
                invulnerableTimer--;
                if (invulnerableTimer <= 0) isInvulnerable = false;
            }

            // Lukis Bintang
            ctx.fillStyle = "#fff";
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            // Pergerakan Player
            if ((keys["ArrowLeft"] || isTouchingLeft) && player.x > player.radius) player.x -= player.speed;
            if ((keys["ArrowRight"] || isTouchingRight) && player.x < canvas.width - player.radius) player.x += player.speed;

            // Lukis Player
            if (!isInvulnerable || Math.floor(invulnerableTimer / 5) % 2 === 0) {
                ctx.save();
                ctx.shadowBlur = 20; ctx.shadowColor = "#b666ff";
                ctx.fillStyle = "#ffffff"; 
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#b666ff"; ctx.lineWidth = 3; ctx.stroke();
                ctx.restore();
            }

            // Update Peluru Player
            for (let i = 0; i < bullets.length; i++) {
                let b = bullets[i];
                b.x += b.vx; // Efek serong peluru lvl 3
                b.y += b.vy;

                ctx.save();
                ctx.shadowBlur = 10; ctx.shadowColor = "#00ffff"; 
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(b.x - 2, b.y, 4, 15);
                ctx.restore();

                if (b.y < 0 || b.x < 0 || b.x > canvas.width) { bullets.splice(i, 1); i--; }
            }

            // Update Peluru Laser Musuh (Level 3 Sahaja)
            for (let eBIdx = 0; eBIdx < enemyBullets.length; eBIdx++) {
                let eb = enemyBullets[eBIdx];
                eb.y += 5; // Peluru musuh meluru ke bawah

                ctx.save();
                ctx.shadowBlur = 8; ctx.shadowColor = "#ff0000";
                ctx.fillStyle = "#ff3333"; // Peluru merah berbahaya
                ctx.fillRect(eb.x - 2, eb.y, 4, 12);
                ctx.restore();

                // Check peluru musuh kena player
                if (!isInvulnerable) {
                    let distPlayerB = Math.hypot(player.x - eb.x, player.y - eb.y);
                    if (distPlayerB < player.radius) {
                        enemyBullets.splice(eBIdx, 1);
                        eBIdx--;
                        lives -= 1;
                        updateLivesUI();
                        if (lives <= 0) { gameOver = true; playSound('defeat'); } else { playSound('hurt'); isInvulnerable = true; invulnerableTimer = 90; }
                        continue;
                    }
                }

                if (eb.y > canvas.height) { enemyBullets.splice(eBIdx, 1); eBIdx--; }
            }

            // Generate Musuh
            enemyTimer++;
            if (enemyTimer % spawnRate === 0) {
                let randomX = Math.random() * (canvas.width - 40) + 20;
                enemies.push({ 
                    x: randomX, 
                    y: -20, 
                    radius: 14, 
                    baseX: randomX, // Digunapakai untuk fungsi gelombang gerakan lvl 2 & 3
                    angle: Math.random() * 10,
                    shootCooldown: Math.random() * 100 + 40 // Cooldown tembakan musuh lvl 3
                });
            }

            // Update Musuh
            for (let j = 0; j < enemies.length; j++) {
                let e = enemies[j];
                
                // PENGURUSAN GERAKAN AI MUSUH MENGIKUT LEVEL
                if (currentLevel === 1) {
                    e.y += 1.8; // Level 1: Jatuh lurus chill
                } 
                else if (currentLevel === 2) {
                    e.y += 2.2; 
                    e.angle += 0.05;
                    e.x = e.baseX + Math.sin(e.angle) * 35; // Level 2: Gerakan ombak/sinusoid kiri kanan
                } 
                else if (currentLevel === 3) {
                    e.y += 2.6; 
                    e.angle += 0.07;
                    e.x = e.baseX + Math.sin(e.angle) * 45; // Level 3: Ombak makin ganas + Laju

                    // SERANGAN PELURU MUSUH (LEVEL 3)
                    e.shootCooldown--;
                    if (e.shootCooldown <= 0) {
                        enemyBullets.push({ x: e.x, y: e.y + e.radius });
                        playSound('enemyshoot');
                        e.shootCooldown = Math.random() * 120 + 80; // Reset cooldown tembak
                    }
                }

                // Lukis Musuh
                ctx.save();
                ctx.shadowBlur = 12; ctx.shadowColor = "#ff3333";
                ctx.fillStyle = (currentLevel === 3) ? "#ff0055" : "#ff3333"; 
                ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();

                // Check Peluru Player langgar Musuh
                for (let k = 0; k < bullets.length; k++) {
                    let b = bullets[k];
                    let distBullet = Math.hypot(b.x - e.x, b.y - e.y);
                    if (distBullet < e.radius) {
                        createExplosion(e.x, e.y, "#ff3333"); 
                        createExplosion(e.x, e.y, "#ffff00"); 
                        enemies.splice(j, 1);
                        bullets.splice(k, 1);
                        j--;
                        score += 10;
                        scoreElement.innerText = score;
                        playSound('kill');

                        if (score > 0 && score % 50 === 0 && score !== 100 && score !== 300 && score !== lastMilestone) {
                            playSound('achievement');
                            lastMilestone = score;
                        }
                        break;
                    }
                }

                // Check Musuh langgar Player
                if (e && !isInvulnerable) {
                    let distPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                    if (distPlayer < player.radius + e.radius) {
                        createExplosion(player.x, player.y, "#b666ff"); 
                        lives -= 1;
                        updateLivesUI();

                        if (lives <= 0) {
                            gameOver = true;
                            playSound('defeat');
                        } else {
                            playSound('hurt');
                            isInvulnerable = true;
                            invulnerableTimer = 90; 
                            enemies = []; 
                            enemyBullets = []; // Bersihkan sekali peluru musuh
                            break;
                        }
                    }
                }

                if (e && e.y - e.radius > canvas.height) { enemies.splice(j, 1); j--; }
            }

            // Update Explosion Particles
            for (let pIdx = 0; pIdx < particles.length; pIdx++) {
                let p = particles[pIdx];
                p.x += p.vx; p.y += p.vy; p.alpha -= p.decay; 

                if (p.alpha <= 0) { particles.splice(pIdx, 1); pIdx--; } else {
                    ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
            }

            requestAnimationFrame(updateGame);
        }

        updateGame();
    </script>
</body>
</html>
